name: Release APK

# Every push to main (each merged PR) builds, tests, signs and publishes a GitHub
# Release with a strictly higher versionCode, so the phone installs it as an update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v7

      - name: Compute release version
        run: |
          # versionCode must only grow; run_number grows with every run of this workflow.
          echo "APP_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=0.5.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Require the persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          # A new random key would make the APK impossible to install as an update.
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add repository secrets RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD (see RELEASING.md), then re-run this workflow."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android platform, build-tools and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;$NDK_VERSION" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache pinned models and whisper.cpp source
        uses: actions/cache@v6
        with:
          path: .cache
          key: pinned-${{ hashFiles('DEPENDENCIES.json', 'scripts/prepare_whisper.py', 'scripts/prepare_preview.py', 'scripts/prepare_llama.py') }}

      - name: Prepare pinned models (hash-verified)
        run: python3 scripts/prepare_model.py

      - name: Build native Whisper library
        run: python3 scripts/build_whisper.py --ndk "$ANDROID_HOME/ndk/$NDK_VERSION"

      - name: Prepare pinned llama.cpp (GMind on-device answers)
        run: python3 scripts/prepare_llama.py

      - name: Build native llama.cpp library
        run: python3 scripts/build_llama.py --ndk "$ANDROID_HOME/ndk/$NDK_VERSION"

      - name: Host checks
        run: |
          python3 tests/sentient/run_host_checks.py
          python3 tests/llama-native/run_host_checks.py
          python3 tests/capture/run_host_checks.py --sdk "$ANDROID_HOME"
          python3 tests/hybrid/run_host_checks.py
          python3 tests/hybrid/run_job_checks.py
          python3 tests/whisper-java/run_host_checks.py
          python3 tests/omi/run_ble_tests.py
          python3 tests/omi-capture/run_host_checks.py
          python3 tests/omi-composition/run_host_checks.py

      - name: Build release APKs and lint
        run: >
          ./gradlew --no-daemon --console=plain assembleRelease lintDebug
          -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME"

      - name: Sign and verify
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          KEY_DIR="$RUNNER_TEMP/release-key"
          mkdir -m 700 "$KEY_DIR"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEY_DIR/release.p12"
          printf '%s\n' "$KEYSTORE_PASSWORD" > "$KEY_DIR/password"
          chmod 600 "$KEY_DIR"/*
          python3 scripts/sign_release.py --sdk "$ANDROID_HOME" --key-dir "$KEY_DIR" --version "$APP_VERSION_NAME"
          rm -rf "$KEY_DIR"
          python3 tests/hybrid/verify_apk.py --sdk "$ANDROID_HOME" --version-code "$APP_VERSION_CODE" --version-name "$APP_VERSION_NAME" "dist/GVoice-$APP_VERSION_NAME-arm64-v8a.apk"
          python3 tests/sentient/verify_apk.py --sdk "$ANDROID_HOME" --version-code "$APP_VERSION_CODE" --version-name "$APP_VERSION_NAME" --omi-apk "dist/GVoice-$APP_VERSION_NAME-arm64-v8a.apk" "dist/GMind-$APP_VERSION_NAME.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$APP_VERSION_NAME"
          APK="dist/GVoice-$APP_VERSION_NAME-arm64-v8a.apk"
          GMIND="dist/GMind-$APP_VERSION_NAME.apk"
          {
            echo "GVoice $APP_VERSION_NAME (versionCode $APP_VERSION_CODE), built from ${GITHUB_SHA::7}."
            echo
            echo "Install \`GVoice-$APP_VERSION_NAME-arm64-v8a.apk\` on your phone. It updates the previous GVoice release in place and keeps your recordings."
            echo
            echo "GVoice downloads its Whisper models (small 190 MB, medium 539 MB) once, over Wi-Fi by default, from a pinned Hugging Face revision checked by SHA-256. Models already on the phone are kept across updates. Audio and transcripts never leave the phone."
            echo
            echo "GMind's private on-phone answers use Gemini Nano where Android offers it, otherwise Qwen with a faster native build."
            echo
            echo "Optional: \`GMind-$APP_VERSION_NAME.apk\` is the companion knowledge base. It reads GVoice transcripts (same signing key) and is the app that talks to online services."
            echo
            echo '```'
            grep -E 'arm64-v8a|GMind' dist/SHA256SUMS.txt
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          # GitHub intermittently answers 403 "Resource not accessible by integration" here
          # (runs #8 and #11). Retry; if the release already exists (an earlier attempt or a
          # re-run), attach any missing files instead of skipping it.
          for attempt in 1 2 3 4; do
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" "$APK" "$GMIND" dist/SHA256SUMS.txt --clobber && exit 0
            else
              gh release create "$TAG" "$APK" "$GMIND" dist/SHA256SUMS.txt \
                --target "$GITHUB_SHA" --title "GVoice $APP_VERSION_NAME" --notes-file "$RUNNER_TEMP/notes.md" && exit 0
            fi
            echo "::warning::Publishing $TAG failed (attempt $attempt of 4); retrying"
            sleep $((attempt * 30))
          done
          exit 1
